services:
  # 1. Base de Datos (PostgreSQL)
  db:
    image: postgres:15
    container_name: football_db
    restart: always
    environment:
      POSTGRES_DB: footstats_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - ./database/data:/var/lib/postgresql/data
    networks:
      - internal_net

  # 2. Backend (API Python)
  backend:
    image: python:3.10-slim
    container_name: football_api
    volumes:
      - ./backend:/app
    networks:
      - internal_net
      - external_net
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - db
  # 3. Frontend (Servidor de la Web)
  frontend:
    image: nginx:alpine
    container_name: football_ui
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    networks:
      - external_net

  # 4. Proxy Inverso (Nginx Principal)
  nginx:
    image: nginx:alpine
    container_name: football_proxy
    ports:
      - "80:80"
      - "443:443"  # <--- NUEVO: Abrimos el puerto seguro
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/server.crt:/etc/nginx/conf.d/server.crt:ro # <--- NUEVO: Metemos el certificado
      - ./nginx/server.key:/etc/nginx/conf.d/server.key:ro # <--- NUEVO: Metemos la llave
    depends_on:
      - frontend
      - backend
    networks:
      - external_net
networks:
  internal_net:
    driver: bridge
  external_net:
    driver: bridge
